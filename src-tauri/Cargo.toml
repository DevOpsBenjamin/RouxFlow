[package]
name = "rouxflow-desktop"
version = "0.1.8"
description = "RouxFlow - Smart Bluetooth Rubik's Cube Trainer for Roux Method"
authors = ["DevOpsBen"]
license = "MIT"
repository = "https://github.com/DevOpsBenjamin/RouxFlow"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "rouxflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
roux-core = { path = "../crates/roux-core" }
roux-storage-sqlite = { path = "../crates/roux-storage-sqlite" }
roux-storage-cloud = { path = "../crates/roux-storage-cloud" }
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1.0", features = ["v4"] }
btleplug = "0.11"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tauri-plugin-shell = "2.3.4"
tauri-plugin-deep-link = "2.4.6"
tauri-plugin-single-instance = "2.3.7"
