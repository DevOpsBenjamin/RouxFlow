[package]
name = "rouxflow-core"
version = "0.1.8"
edition = "2024"
description = "Core logic for RouxFlow - Roux method speedcubing trainer"
authors = ["DevOpsBen"]
license = "MIT"
repository = "https://github.com/DevOpsBenjamin/RouxFlow"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
aes-gcm = "0.10"
getrandom = { version = "0.2", features = ["js"] }
futures = "0.3"
uuid = { version = "1.0", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
async-trait = "0.1.89"
