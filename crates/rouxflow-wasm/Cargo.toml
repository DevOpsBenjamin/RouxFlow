[package]
name = "rouxflow-wasm"
version = "0.1.0"
edition = "2024"
description = "Single WASM entry point for RouxFlow - re-exports core, render, bluetoothcube, storage"
authors = ["DevOpsBen"]
license = "MIT"
repository = "https://github.com/DevOpsBenjamin/RouxFlow"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rouxflow-core = { path = "../rouxflow-core" }
rouxflow-render = { path = "../rouxflow-render" }
rouxflow-bluetoothcube = { path = "../rouxflow-bluetoothcube" }
rouxflow-storage = { path = "../rouxflow-storage" }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }

[dependencies.web-sys]
version = "0.3"
features = [
  "Document",
  "Window",
  "HtmlCanvasElement",
  "Element",
]
