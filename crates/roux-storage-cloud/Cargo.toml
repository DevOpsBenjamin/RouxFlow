[package]
name = "roux-storage-cloud"
version = "0.1.6"
edition = "2024"
description = "Supabase cloud storage driver for RouxFlow"
authors = ["DevOpsBen"]
license = "MIT"
repository = "https://github.com/DevOpsBenjamin/RouxFlow"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
roux-core = { path = "../roux-core" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
getrandom = { version = "0.2", features = ["js"] }
