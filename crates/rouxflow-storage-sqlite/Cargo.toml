[package]
name = "rouxflow-storage-sqlite"
version = "0.1.8"
edition = "2024"
description = "SQLite local storage driver for RouxFlow (Tauri desktop)"
authors = ["DevOpsBen"]
license = "MIT"
repository = "https://github.com/DevOpsBenjamin/RouxFlow"

[dependencies]
async-trait = "0.1.89"
rouxflow-core = { path = "../rouxflow-core" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
