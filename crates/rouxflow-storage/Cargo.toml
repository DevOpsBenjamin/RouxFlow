[package]
name = "rouxflow-storage"
version = "0.0.23"
edition = "2024"
description = "Unified storage for RouxFlow - IndexedDB (local) + Supabase (cloud) + sync"
authors = ["DevOpsBen"]
license = "MIT"
repository = "https://github.com/DevOpsBenjamin/RouxFlow"

[dependencies]
rouxflow-core = { path = "../rouxflow-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1.89"
log = "0.4"

# WASM-only dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
rexie = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Navigator", "NetworkInformation"] }
reqwest = { version = "0.12", features = ["json"] }
getrandom = { version = "0.2", features = ["js"] }
