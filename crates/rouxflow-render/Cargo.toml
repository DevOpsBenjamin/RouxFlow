[package]
name = "rouxflow-render"
version = "0.0.22"
edition = "2021"
authors = ["DevOpsBen"]
rust-version = "1.77.2"

[lib]
crate-type = ["rlib"]

[dependencies]
three-d = "0.17"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
cgmath = "0.18"
rouxflow-core = { path = "../rouxflow-core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Window", "HtmlCanvasElement", "Element", "WebGl2RenderingContext", "Performance", "DomRect"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
