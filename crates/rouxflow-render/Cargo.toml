[package]
name = "rouxflow-render"
version = "0.1.0"
edition = "2021"
authors = ["DevOpsBen"]
rust-version = "1.77.2"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
three-d = "0.17"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
cgmath = "0.18"

[dependencies.web-sys]
version = "0.3"
features = [
  "Document",
  "Window",
  "HtmlCanvasElement",
  "Element"
]
