<!DOCTYPE html>
<html>

<head>
    <title>Solve Replay Debug</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a;
            color: #d4d4d4;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #columns {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #333;
            overflow: hidden;
        }

        .pane:last-child {
            border-right: none;
        }

        .pane-title {
            padding: 4px 12px;
            font-size: 11px;
            font-weight: bold;
            background: #2d2d2d;
            color: #888;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }

        .pane-content {
            flex: 1;
            overflow-y: scroll;
            padding: 10px 14px;
        }

        pre {
            white-space: pre-wrap;
            line-height: 1.4;
        }

        /* ANSI colors */
        .c31 {
            color: #f44336;
        }

        .c32 {
            color: #4caf50;
        }

        .c33 {
            color: #ffeb3b;
        }

        .c34 {
            color: #42a5f5;
        }

        .c35 {
            color: #e040fb;
        }

        .c36 {
            color: #26c6da;
        }

        .c93 {
            color: #fff176;
        }

        .c97 {
            color: #ffffff;
        }

        .c208 {
            color: #ffa726;
        }

        .bold {
            font-weight: bold;
        }

        .dim {
            opacity: 0.45;
        }
    </style>
</head>

<body>
    <div id="columns">
        <div class="pane">
            <div class="pane-title">📊 ANALYZE_SOLVE — Pass 1 / 2 / 3</div>
            <div class="pane-content">
                <pre>[ANALYSIS_CONTENT]</pre>
            </div>
        </div>
        <div class="pane">
            <div class="pane-title">🎲 PERSPECTIVAL REPLAY — Cube States</div>
            <div class="pane-content">
                <pre>[REPLAY_CONTENT]</pre>
            </div>
        </div>
    </div>
</body>

</html>
