[package]
name = "roux-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
aes-gcm = "0.10"
getrandom = { version = "0.2", features = ["js"] }
